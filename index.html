<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Second Brain Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="core/core.css">
<style>
  body{background:var(--night);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .dots{position:fixed;inset:0;background-image:radial-gradient(rgba(237,228,208,.12) 1.4px,transparent 1.4px);background-size:24px 24px;pointer-events:none}
  .door{position:relative;max-width:440px;width:100%;text-align:center}
  .door .eyebrow{color:var(--text-on-dark-faint);display:block;margin-bottom:18px}
  .door h1{color:var(--text-on-dark);font-size:clamp(34px,7vw,46px);font-weight:800;margin-bottom:12px;letter-spacing:-.03em}
  .door p{color:var(--text-on-dark-faint);font-size:15.5px;line-height:1.6}
  .door input{width:100%;margin-top:20px;padding:15px 16px;border-radius:var(--radius-md);border:1.5px solid var(--night-rule);background:var(--night-2);color:var(--text-on-dark);font-family:var(--font-sans);font-size:17px;text-align:center}
  .door input:focus{outline:none;border-color:var(--olive-lift)}
  .door .err{color:var(--signal);font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;min-height:34px;margin-top:14px;line-height:1.5}
  .door .go{margin-top:4px}
  .door .foot{margin-top:34px;padding-top:18px;border-top:1px solid var(--night-rule);font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;color:var(--text-on-dark-faint);line-height:1.8}
</style>
</head>
<body>
<div class="dots"></div>

<div class="door">
  <span class="eyebrow">Private build</span>
  <h1>Second Brain<br>Builder</h1>
  <p>Each build is made for one person. Type your first name to open yours.</p>
  <input id="who" type="text" autocomplete="off" autocapitalize="words" placeholder="your first name" aria-label="your first name">
  <div class="err" id="err"></div>
  <button class="btn go" id="gobtn">Open my build →</button>
  <div class="foot">
    One folder of plain text.<br>
    Built by Trevor.
  </div>
</div>

<script>
/* Name → path. Nothing secret here: each build still has its own password.
   Add a line per person. Keys are lowercase, no punctuation. */
const SEATS = {
  erica: 'erica/',
  katie: 'katie/'
};

const who = document.getElementById('who'), err = document.getElementById('err');
const norm = s => s.toLowerCase().trim().replace(/[^a-z]/g, '');

function open_() {
  const k = norm(who.value);
  if (!k) { err.textContent = 'Type your first name'; return; }
  const path = SEATS[k];
  if (path) { location.href = path; return; }
  err.textContent = "No build under that name yet — check the spelling, or ask Trevor";
}

document.getElementById('gobtn').addEventListener('click', open_);
who.addEventListener('keydown', e => { if (e.key === 'Enter') open_(); });
who.addEventListener('input', () => { err.textContent = ''; });
who.focus();
</script>
</body>
</html>
